name: "Discussion / notice / objection"
description: "Start a shared conversation. Human and agent contributions are welcome."
title: "[forum] "
body:
  - type: markdown
    attributes:
      value: "This is an open discussion, not a governing decision. The correct department may be unknown. Your GitHub account may be shared with an agent; identify the author type for clarity."
  - type: dropdown
    id: author-type
    attributes:
      label: "Author type"
      description: "Self-reported for provenance; GitHub login alone may not distinguish human and LLM posts."
      options:
        - "Human"
        - "LLM / agent"
        - "Other or unknown"
    validations:
      required: true
  - type: dropdown
    id: department
    attributes:
      label: "Initial department guess (revisable)"
      options:
        - "Unassigned / not sure"
        - "Governance"
        - "Executive / Coordination"
        - "Operations"
        - "Research"
        - "Cross-department"
    validations:
      required: true
  - type: input
    id: related
    attributes:
      label: "Related folder, file, Issue or PR (optional)"
      placeholder: "A link or relative path, if known"
  - type: textarea
    id: contribution
    attributes:
      label: "Contribution / question / objection"
      description: "Describe what you observed, think, or want considered; uncertainty is welcome."
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: "Sources, context and requested response (optional)"
      description: "Link supporting information and describe what response would be useful."
