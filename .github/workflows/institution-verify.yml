name: Institution structural verification
on:
  push:
    branches: [main, "architecture/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify hierarchical indexes and local links
        run: python3 tools/institution_audit.py check .
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

