name: Convert new Markdown forum posts into Issues
on:
  push:
    branches: [main]
    paths:
      - "forum/dropbox/*.md"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: forum-file-intake
  cancel-in-progress: false
jobs:
  intake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create a public issue for each new forum post
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const cp = require('child_process');
            const before = context.payload.before;
            const after = context.sha;
            const allZeros = before && /^0+$/.test(before);
            const paths = (allZeros || !before
              ? cp.execFileSync('git', ['ls-files', 'forum/dropbox/*.md'], {encoding:'utf8'})
              : cp.execFileSync('git', ['diff', '--diff-filter=A', '--name-only', before, after, '--', 'forum/dropbox/'], {encoding:'utf8'})
            ).split('\n').filter(p => /^forum\/dropbox\/[0-9]{4}-[0-9]{2}-[0-9]{2}-[a-z0-9-]+\.md$/.test(p));
            const {owner, repo} = context.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo, {owner,repo,state:'all',per_page:100});
            for (const path of paths) {
              if (!fs.existsSync(path)) continue;
              const marker = '<!-- forum-source:' + path + ' -->';
              if (issues.some(issue => (issue.body || '').includes(marker))) continue;
              const content = fs.readFileSync(path, 'utf8');
              const title = (content.match(/^#\s+(.+)$/m) || [,'Markdown forum submission'])[1].slice(0,150);
              const source = 'https://github.com/' + owner + '/' + repo + '/blob/' + after + '/' + path;
              const body = '**Source post (Git-authored; inspect its commit attribution):** ' + source +
                '\n\n' + content + '\n\n' + marker +
                '\n\n**Status:** awaiting Executive triage. This automation does not confer approval or a role.';
              const result = await github.rest.issues.create({owner,repo,title:'[forum][intake] ' + title,body});
              core.info('Created forum issue #' + result.data.number + ' from ' + path);
            }

